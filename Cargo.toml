[workspace]
members = ["crates/c-source-bundle", "crates/c-source-emit"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/uni-kakurenbo/c-source-tools"

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[package]
name = "c-source-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Generate C emitters and bundle ordinary C modules using a configurable compiler"

[lints]
workspace = true

[dependencies]
c-source-bundle = { path = "crates/c-source-bundle" }
c-source-emit = { path = "crates/c-source-emit" }
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
